[package]
name = "jev-terminal-doctor"
version = "0.1.0"
edition = "2021"
description = "Live terminal assistant — detects build/test errors and prepares fix patches (jev ecosystem)"
license = "MIT"
repository = "https://github.com/Cadman021/jev-terminal-doctor"
readme = "README.md"
keywords = ["terminal", "ai", "developer-tools", "cli", "jev"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# PTY handling — کنترل ترمینال زیرین و گرفتن stdout/stderr به‌صورت شفاف
portable-pty = "0.8"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Git diff / context
git2 = "0.19"

# HTTP client برای ai/client.rs
reqwest = { version = "0.12", features = ["json", "stream"] }

# سریالایز/دیسریالایز JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# رنگ و لاگ در ترمینال
console = "0.15"

# regex برای heuristic pattern-matching خطاها
regex = "1"
once_cell = "1"

# async streams
futures = "0.3"

# trait-based design برای ai::client (امکان تعویض provider در آینده)
async-trait = "0.1"

# اعمال hunk-by-hunk پچ‌های unified diff (جلوگیری از overwrite مخرب فایل)
diffy = "0.4"

# حذف ANSI escape codes قبل از pattern-matching خطاها (خروجی cargo رنگی است)
strip-ansi-escapes = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
