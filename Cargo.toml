[package]
name = "jev-terminal-doctor"
version = "0.1.0"
edition = "2021"
description = "Live terminal assistant — detects build/test errors and prepares fix patches (jev ecosystem)"
license = "GPL-3.0-only"
repository = "https://github.com/Cadman021/jev-terminal-doctor"
readme = "README.md"
keywords = ["terminal", "ai", "developer-tools", "cli", "jev"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jev"
path = "src/main.rs"

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# PTY handling — control the underlying terminal and capture stdout/stderr transparently
portable-pty = "0.8"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Git diff / context
git2 = "0.19"

# HTTP client for ai/client.rs
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON serialization/deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Terminal colors and logging
console = "0.15"

# Regex for heuristic error pattern-matching
regex = "1"
once_cell = "1"

# Async streams
futures = "0.3"

# Trait-based design for ai::client (swap providers in the future)
async-trait = "0.1"

# Hunk-by-hunk application of unified diffs (prevents destructive overwrite)
diffy = "0.4"

# Strip ANSI escape codes before error pattern-matching (cargo output is colored)
strip-ansi-escapes = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
